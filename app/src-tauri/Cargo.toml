[package]
name = "lilo"
version = "0.1.0"
description = "Lilo — free, open-source embroidery digitizer with Wi-Fi send to embroidery machines"
authors = ["Kadwood"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` = a transparent webview, so the window's glass shows through the page. It must
# match `app.macOSPrivateApi` in tauri.conf.json (tauri-build checks) and rules out the Mac App Store,
# which is fine for direct-download releases. It does nothing off macOS.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
# Native Open/Save dialogs and file I/O for the editor (paths picked in a dialog are auto-scoped).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Launch-on-login (LaunchAgent on macOS, registry/desktop entry elsewhere).
tauri-plugin-autostart = "2"
# In-app updates from GitHub Releases (latest.json, minisign-verified) and the relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + local HTTP server
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
axum = "0.8"

# Machine HTTP client.
#
# IMPORTANT: `native-tls` (SecureTransport / SChannel / OpenSSL) is required, NOT
# rustls. Brother machines negotiate TLS_RSA_WITH_AES_256_GCM_SHA384 (static RSA
# key exchange, no forward secrecy). rustls deliberately does not implement
# static-RSA cipher suites, so a rustls client cannot complete the handshake.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }

thiserror = "2"
async-trait = "0.1"

# Ember Link dongle discovery (current _ember-link._tcp and legacy _ember-connect._tcp).
mdns-sd = "0.13"
# Ember Link desktop setup — the dongle's CDC-ACM serial port over USB.
serialport = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
if-addrs = "0.13"
futures = "0.3"
bytes = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
# The NSView type `window-vibrancy`'s Liquid Glass options take (same 0.3.x it already uses).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSWorkspace", "NSAccessibility"] }

# Window material: Liquid Glass (macOS 26+) / sidebar vibrancy (older macOS) / Mica (Windows 11).
# Pinned: 0.7 -> 0.8 changed the Liquid Glass API (positional args -> LiquidGlassOptions).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "=0.8.1"
