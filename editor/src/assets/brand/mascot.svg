<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB36B"/><stop offset=".55" stop-color="#FF7A8A"/><stop offset="1" stop-color="#7A5CC8"/></linearGradient>
<radialGradient id="fur" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#5FD0E6"/><stop offset="1" stop-color="#1F8FB3"/></radialGradient>
