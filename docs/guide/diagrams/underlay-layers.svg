  <rect x="40" y="140" width="400" height="18" fill="#bdbdbd"/>
  <rect x="40" y="118" width="400" height="22" fill="#e6d3b3"/>
  <g fill="#4c9a6a">
    <rect x="130" y="104" width="30" height="14" rx="4"/><rect x="170" y="104" width="30" height="14" rx="4"/><rect x="210" y="104" width="30" height="14" rx="4"/><rect x="250" y="104" width="30" height="14" rx="4"/><rect x="290" y="104" width="30" height="14" rx="4"/>
  </g>
  <g fill="#1f6f8b">
    <rect x="120" y="80" width="12" height="24" rx="5"/><rect x="138" y="80" width="12" height="24" rx="5"/><rect x="156" y="80" width="12" height="24" rx="5"/><rect x="174" y="80" width="12" height="24" rx="5"/><rect x="192" y="80" width="12" height="24" rx="5"/><rect x="210" y="80" width="12" height="24" rx="5"/><rect x="228" y="80" width="12" height="24" rx="5"/><rect x="246" y="80" width="12" height="24" rx="5"/><rect x="264" y="80" width="12" height="24" rx="5"/><rect x="282" y="80" width="12" height="24" rx="5"/><rect x="300" y="80" width="12" height="24" rx="5"/><rect x="318" y="80" width="12" height="24" rx="5"/>
