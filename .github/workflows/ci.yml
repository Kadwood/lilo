name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # package.json, Cargo.toml/lock and tauri.conf.json must all carry the same version.
      - run: pnpm check-versions
      - run: pnpm test:scripts
      # Built-in embroidery fonts are generated, not committed. Cache the pinned download.
      - id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types --no-warnings scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lilo-fonts-cache
          key: lilo-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
        env:
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache
      - run: pnpm fonts:check
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm --filter editor build

  rust:
    # macOS first: it's the primary target and needs no extra system packages for Tauri.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
      - id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types --no-warnings scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lilo-fonts-cache
          key: lilo-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
        env:
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache
      # tauri::generate_context! embeds the frontend, so it must be built first.
      - run: pnpm --filter editor build
      - run: cargo test --all-targets
        working-directory: app/src-tauri
      - run: cargo build
        working-directory: app/src-tauri
