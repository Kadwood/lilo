name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # package.json, Cargo.toml/lock and tauri.conf.json must all carry the same version.
      - run: pnpm check-versions
      - run: pnpm test:scripts
      # The old product name may only appear in NOTICE.md.
      - run: node scripts/check-no-ember.mjs
      # The guide: pages, links, hints, tour and warnings validate, and the generated pages and index.json are current.
      - run: pnpm guide:check
      # Built-in embroidery fonts are generated, not committed. Cache the pinned download.
      - id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types --no-warnings scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lilo-fonts-cache
          key: lilo-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
        env:
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache
      - run: pnpm fonts:check
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm --filter editor build

  # The browser journeys (editor/e2e) take about 8 minutes, so they are opt-in: run this workflow by hand
  # (Actions > CI > Run workflow) or put [e2e] in a commit message.
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types --no-warnings scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lilo-fonts-cache
          key: lilo-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
        env:
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache
      - run: pnpm --filter editor exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm --filter editor e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: editor/e2e/.shots
          if-no-files-found: ignore

  rust:
    # macOS first: it's the primary target and needs no extra system packages for Tauri.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
      - id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types --no-warnings scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lilo-fonts-cache
          key: lilo-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
        env:
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache
      # tauri::generate_context! embeds the frontend, so it must be built first.
      - run: pnpm --filter editor build
      - run: cargo test --all-targets
        working-directory: app/src-tauri
      - run: cargo build
        working-directory: app/src-tauri
