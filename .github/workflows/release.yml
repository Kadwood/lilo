name: Release

# On a `v*` tag: build macOS (signed + notarized), Windows and Linux, then create a DRAFT GitHub
# release with every installer, SHA256SUMS, the updater bundles and latest.json. Nothing reaches
# users until Jins publishes the draft (docs/RELEASING.md).
# Run by hand (workflow_dispatch): build the same bundles and keep them as workflow artifacts only.
# No release, no tag, nothing public.
#
# Docs this follows (checked 2026-10):
#   macOS signing + notarization  https://v2.tauri.app/distribute/sign/macos/
#   updater artifacts, latest.json https://v2.tauri.app/plugin/updater/
#   DMG options                   https://v2.tauri.app/distribute/dmg/
#   Linux build packages          https://v2.tauri.app/start/prerequisites/#linux
#
# Why not tauri-apps/tauri-action: its matrix jobs all edit one release and one latest.json at the
# same time (a race), and it hides the bundle paths. Here every job only builds and uploads a
# workflow artifact, and ONE final job writes the release, so a failed platform can never leave a
# half-published release behind. The build step is plain `pnpm tauri build`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: Check version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versions agree (and match the tag)
        id: v
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            node scripts/check-versions.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-versions.mjs
          fi
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Release script tests
        run: node --test scripts/release-scripts.test.mjs
      - name: Release notes exist (tag only)
        if: env.IS_RELEASE == 'true'
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null
      - name: Updater public key is real (tag only)
        if: env.IS_RELEASE == 'true'
        run: |
          key="$(tr -d '[:space:]' < app/src-tauri/updater.pub)"
          if [ -z "$key" ] || [[ "$key" == REPLACE_WITH_UPDATER_PUBLIC_KEY* ]]; then
            echo "::error::app/src-tauri/updater.pub still holds the placeholder. Generate the updater key pair first (docs/RELEASING.md)."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            id: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: app/src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows x64
            id: windows
            os: windows-latest
            args: --bundles nsis
            bundle_dir: app/src-tauri/target/release/bundle
          - name: Linux x64
            id: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            bundle_dir: app/src-tauri/target/release/bundle
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Secrets are only readable through env (not in `if:`), so lift the "is it set" bits here.
      HAVE_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
      HAVE_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # the universal Mac binary is built from both
          targets: ${{ matrix.id == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile

      # Built-in embroidery fonts are generated, not committed (same cache as ci.yml).
      - id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types --no-warnings scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lilo-fonts-cache
          key: lilo-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
        env:
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache

      # ---- updater artifacts -------------------------------------------------------------------
      # `createUpdaterArtifacts` makes Tauri sign every bundle with TAURI_SIGNING_PRIVATE_KEY, so it
      # is only switched on when that secret exists (it is not in tauri.conf.json: building from
      # source must not need our key). A tag build without it fails; a manual run just skips it.
      - name: Updater artifacts
        run: |
          if [ "$HAVE_UPDATER_KEY" != "true" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set; a release needs signed updater bundles (docs/RELEASING.md)."
              exit 1
            fi
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: building without updater artifacts."
            exit 0
          fi
          # The public key comes from the committed updater.pub, the same file the app embeds.
          node -e '
            const pub = require("fs").readFileSync("app/src-tauri/updater.pub", "utf8").trim();
            const cfg = { bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: pub } } };
            console.log("LILO_TAURI_CONFIG=" + JSON.stringify(cfg));
          ' >> "$GITHUB_ENV"

      # ---- macOS: Developer ID signing + notarization -------------------------------------------
      # Cert goes into a throwaway keychain, the notary key (.p8) into a file; both are removed in
      # the always() step below. Tauri then signs with the hardened runtime and notarizes via the
      # App Store Connect API key (APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH).
      - name: macOS signing setup
        if: matrix.id == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ "$HAVE_APPLE" != "true" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Apple signing secrets are not set; a release must be signed and notarized (docs/RELEASING.md)."
              exit 1
            fi
            echo "::warning::Apple secrets not set: building UNSIGNED."
            exit 0
          fi
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lilo-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # search our keychain first, keep the defaults after it
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          echo "Signing identities in the temporary keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY" > /dev/null \
            || { echo "::error::APPLE_SIGNING_IDENTITY is not in the imported certificate."; exit 1; }

          P8="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$P8"
          chmod 600 "$P8"
          {
            echo "LILO_KEYCHAIN=$KEYCHAIN"
            echo "APPLE_API_KEY_PATH=$P8"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          # Tauri reads these itself; they are empty (and signing is skipped) when the secrets are unset.
          APPLE_SIGNING_IDENTITY: ${{ env.HAVE_APPLE == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ env.HAVE_APPLE == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ env.HAVE_APPLE == 'true' && secrets.APPLE_API_ISSUER || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LILO_FONTS_CACHE: ${{ runner.temp }}/lilo-fonts-cache
          # linuxdeploy (AppImage) cannot use FUSE on a CI runner and chokes on newer ELF sections
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        # (--config, not the TAURI_CONFIG env var: the CLI ignores that one when bundling)
        run: pnpm tauri build ${{ matrix.args }} ${LILO_TAURI_CONFIG:+--config "$LILO_TAURI_CONFIG"}

      # Tauri notarizes and staples the .app but only SIGNS the .dmg (checked with a local run:
      # `spctl` says "Unnotarized Developer ID" for it). Notarize and staple the DMG too, so it
      # opens cleanly even offline.
      - name: Notarize and staple the DMG (macOS)
        if: matrix.id == 'macos' && env.HAVE_APPLE == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          DMG="$(ls ${{ matrix.bundle_dir }}/dmg/*.dmg)"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$DMG"

      - name: Verify signature and notarization (macOS)
        if: matrix.id == 'macos' && env.HAVE_APPLE == 'true'
        run: |
          set -euo pipefail
          B="${{ matrix.bundle_dir }}"
          APP="$(ls -d "$B"/macos/*.app)"
          DMG="$(ls "$B"/dmg/*.dmg)"
          echo "== $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier|flags=.*runtime"
          spctl -a -vv -t exec "$APP"
          xcrun stapler validate "$APP"
          echo "== $DMG"
          codesign --verify --verbose=2 "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"

      - name: macOS cleanup
        if: always() && matrix.id == 'macos'
        run: |
          if [ -n "${LILO_KEYCHAIN:-}" ]; then security delete-keychain "$LILO_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/certificate.p12"

      # ---- collect: one flat folder of release-ready files -------------------------------------
      - name: Collect bundles
        run: |
          set -euo pipefail
          B="${{ matrix.bundle_dir }}"
          mkdir -p out
          case "${{ matrix.id }}" in
            macos)
              cp "$B"/dmg/*.dmg out/
              # the updater bundle is the .app in a tar.gz: give it a versioned, self-explaining name
              if [ -f "$B"/macos/Lilo.app.tar.gz ]; then
                cp "$B/macos/Lilo.app.tar.gz"     "out/Lilo_${VERSION}_universal.app.tar.gz"
                cp "$B/macos/Lilo.app.tar.gz.sig" "out/Lilo_${VERSION}_universal.app.tar.gz.sig"
              fi
              ;;
            windows)
              cp "$B"/nsis/*-setup.exe out/
              cp "$B"/nsis/*-setup.exe.sig out/ 2>/dev/null || true
              ;;
            linux)
              cp "$B"/appimage/*.AppImage out/
              cp "$B"/appimage/*.AppImage.sig out/ 2>/dev/null || true
              cp "$B"/deb/*.deb out/
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: lilo-${{ matrix.id }}
          path: out/*
          if-no-files-found: error
          retention-days: ${{ env.IS_RELEASE == 'true' && 7 || 14 }}

  # ---- smoke tests: install the built bundles on a clean runner and check Lilo really starts --------
  # Each one installs (or unpacks) the artifact, launches the app, and polls the local API
  # (GET http://127.0.0.1:17841/api/health) until it says app=lilo and the version being released.
  # `release` needs all three, so a failure here means no draft release. Screenshots go up as
  # `smoke-*` artifacts (not `lilo-*`, so the release job never picks them up).
  smoke-windows:
    name: Smoke test Windows install
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: lilo-windows
          path: dist

      - name: WebView2 runtime is present
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $pv) { Write-Error 'WebView2 runtime not found on this runner'; exit 1 }
          Write-Output "WebView2 $pv"

      - name: Silent install (per-user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { Write-Error 'no *-setup.exe in the lilo-windows artifact'; exit 1 }
          Write-Output "Installing $($setup.Name)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          # Find the install dir: the per-user uninstall key first, then the default location.
          $dir = $null
          $roots = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          foreach ($e in Get-ItemProperty -Path $roots -ErrorAction SilentlyContinue) {
            if ($e.DisplayName -eq 'Lilo' -and $e.InstallLocation) { $dir = $e.InstallLocation.Trim('"'); break }
          }
          if (-not $dir) { $dir = Join-Path $env:LOCALAPPDATA 'Lilo' }
          $exe = Join-Path $dir 'Lilo.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse $env:LOCALAPPDATA -Filter '*.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*Lilo*' } | ForEach-Object { Write-Output $_.FullName }
            Write-Error "Lilo.exe not found in $dir"; exit 1
          }
          Write-Output "Installed at $dir"
          "LILO_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LILO_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch and check the local API
        shell: pwsh
        run: |
          $app = Start-Process -FilePath $env:LILO_EXE -PassThru
          node scripts/smoke-health.mjs --version $env:VERSION --timeout 60
          if ($LASTEXITCODE -ne 0) { Write-Error 'health check failed'; exit 1 }
          if ($app.HasExited) { Write-Error "Lilo exited on its own (code $($app.ExitCode))"; exit 1 }

      - name: Screenshot
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\windows-desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows-screenshot
          path: ${{ runner.temp }}/windows-desktop.png
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Lilo
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name 'Lilo' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: Silent uninstall removes the install
        shell: pwsh
        run: |
          $un = Join-Path $env:LILO_DIR 'uninstall.exe'
          if (-not (Test-Path $un)) { Write-Error "uninstaller not found at $un"; exit 1 }
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          # NSIS copies the uninstaller to temp and returns early, so wait for the folder to vanish.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path (Join-Path $env:LILO_DIR 'Lilo.exe')) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $env:LILO_DIR 'Lilo.exe')) { Write-Error 'Lilo.exe still there after uninstall'; exit 1 }
          Write-Output 'Uninstalled cleanly'

  smoke-linux:
    name: Smoke test Linux (.deb and AppImage)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Software rendering inside Xvfb: no GPU on the runner.
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: lilo-linux
          path: dist

      - name: Runtime packages (no -dev, no build tools)
        run: |
          sudo apt-get update
          # What a user's machine needs. The .deb pulls most of it in itself; the AppImage test
          # below relies on these being on the system (AppImages bundle webkit but not GTK/X libs).
          sudo apt-get install -y xvfb imagemagick dbus-x11 libwebkit2gtk-4.1-0 libgtk-3-0 \
            libayatana-appindicator3-1 librsvg2-2 libssl3 xdg-utils

      - name: .deb installs and launches
        run: |
          set -euo pipefail
          debs=(dist/*.deb); deb="${debs[0]}"
          [ -f "$deb" ] || { echo "::error::no .deb in the lilo-linux artifact"; exit 1; }
          pkg="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get install -y "./$deb"
          dpkg -L "$pkg"
          bin="$(dpkg -L "$pkg" | grep -E '^/usr/bin/[^/]+$' | head -n 1)"
          [ -n "$bin" ] || { echo "::error::the .deb installs nothing in /usr/bin"; exit 1; }
          echo "binary: $bin"
          ldd "$bin" | grep "not found" && { echo "::error::missing shared libraries"; exit 1; } || true
          xvfb-run -a -s "-screen 0 1280x800x24" \
            scripts/smoke-launch.sh "$VERSION" "$RUNNER_TEMP/linux-deb.png" "$bin"
          sudo apt-get remove -y "$pkg"
          [ ! -e "$bin" ] || { echo "::error::$bin still there after apt remove"; exit 1; }

      - name: AppImage launches (no FUSE)
        run: |
          set -euo pipefail
          imgs=(dist/*.AppImage); img="${imgs[0]}"
          [ -f "$img" ] || { echo "::error::no AppImage in the lilo-linux artifact"; exit 1; }
          chmod +x "$img"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            scripts/smoke-launch.sh "$VERSION" "$RUNNER_TEMP/linux-appimage.png" "$PWD/$img" --appimage-extract-and-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux-screenshots
          path: ${{ runner.temp }}/linux-*.png
          if-no-files-found: warn
          retention-days: 7

  smoke-macos:
    name: Smoke test macOS DMG
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Same "is it signed" test the build job used; unsigned dispatch builds skip the spctl check.
      HAVE_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: lilo-macos
          path: dist

      - name: Copy Lilo.app out of the DMG
        run: |
          set -euo pipefail
          dmgs=(dist/*.dmg); dmg="${dmgs[0]}"
          [ -f "$dmg" ] || { echo "::error::no .dmg in the lilo-macos artifact"; exit 1; }
          mnt="$RUNNER_TEMP/lilo-dmg"
          mkdir -p "$mnt" "$RUNNER_TEMP/lilo-app"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          ls "$mnt"
          cp -R "$mnt/Lilo.app" "$RUNNER_TEMP/lilo-app/"
          hdiutil detach "$mnt"

      - name: Gatekeeper accepts it (signed builds only)
        if: env.HAVE_APPLE == 'true'
        run: spctl -a -vv -t exec "$RUNNER_TEMP/lilo-app/Lilo.app"

      - name: Launch and check the local API
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/lilo-app/Lilo.app"
          bins=("$app"/Contents/MacOS/*); bin="${bins[0]}"
          [ -x "$bin" ] || { echo "::error::no executable in $app/Contents/MacOS"; exit 1; }
          echo "binary: $bin"
          scripts/smoke-launch.sh "$VERSION" - "$bin"

  release:
    name: Draft release
    # tags only: a manual run stops after the artifacts above
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build, smoke-windows, smoke-linux, smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: lilo-*
          path: assets
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > notes.md

      - name: latest.json (updater manifest)
        run: node scripts/make-latest-json.mjs --dir assets --version "$VERSION" --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md > assets/latest.json

      - name: SHA256SUMS
        working-directory: assets
        run: |
          # installers and updater bundles (the .sig files and latest.json are self-checking)
          files=()
          for f in *; do
            case "$f" in *.sig | latest.json | SHA256SUMS) ;; *) files+=("$f") ;; esac
          done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        run: |
          set -euo pipefail
          # A re-run replaces its own earlier DRAFT; it never touches a published release.
          if state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$state" = "true" ] || { echo "::error::Release $GITHUB_REF_NAME is already published."; exit 1; }
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre \
            --title "Lilo $VERSION" --notes-file notes.md assets/*
          gh release view "$GITHUB_REF_NAME" --json url,isDraft,assets --jq '"Draft: \(.url)\n" + (.assets | map("  " + .name) | join("\n"))'
